name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; installing it explicitly keeps
      # the contract code hashes reproducible across runners, since a
      # different rustc emits different WASM and therefore different
      # contract keys.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # The webapp `include_bytes!`s the contract WASM so its code hash is a
      # fact about the bundle rather than a claim about a deployment. That
      # WASM is build output and is gitignored, so it must exist before
      # anything compiles the webapp -- clippy and test both do. Without this
      # step a clean checkout fails at `couldn't read
      # ../contracts/bitcoin_address_contract.wasm`, which is how the pinned
      # contract-id vectors in `webapp/src/keys.rs` came to have never run in
      # CI at all.
      - name: Build and embed the contracts the webapp reads
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq b3sum
          ./scripts/build-contracts.sh
          mkdir -p webapp/contracts
          cp target/wasm32-unknown-unknown/release/bitcoin_address_contract.wasm webapp/contracts/
          cp target/wasm32-unknown-unknown/release/bitcoin_tip_contract.wasm webapp/contracts/

      - name: Clippy
        run: cargo clippy --workspace
             --exclude bitcoin-address-contract --exclude bitcoin-tip-contract
             --all-targets -- -D warnings

      # The merge laws, SPV verification, and the service layer. These assert
      # convergence on exact serialized bytes, which is how peers actually
      # decide they agree.
      #
      # freenet-bitcoin-generation is listed explicitly. It holds the check
      # that the vendored pointer contract really is the frozen artifact the
      # ecosystem pins -- a guard that is worth nothing unless it runs, which
      # is the same way the contract-id vectors in webapp/src/keys.rs came to
      # have never executed once.
      - name: Test
        # One line on purpose. This used to be a YAML continuation, and a
        # `grep "cargo test"` then showed only its first half -- which reads as
        # though the bridge crate is not tested at all. That false reading cost
        # a review cycle. Keep it greppable.
        run: |
          cargo test -p freenet-bitcoin-common -p freenet-bitcoin-generation -p bitcoin-freenet-bridge -p freenet-bitcoin-webapp

      # The webapp ships as wasm, so lint the target that actually ships --
      # native-only dead-code findings there are noise, and wasm-only ones
      # would otherwise never be seen.
      - name: Clippy (wasm target)
        run: cargo clippy -p freenet-bitcoin-webapp
             --target wasm32-unknown-unknown --all-targets -- -D warnings

      # Already built above; kept as the step that would catch a contract
      # that compiles for the host and not for wasm32.
      - name: Build contracts for wasm32
        run: ./scripts/build-contracts.sh

      # A contract that imports a namespace the runtime does not register
      # builds and publishes fine, then silently fails to instantiate. This is
      # the cheapest possible guard against shipping an unloadable module.
      - name: Contract modules must be loadable
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wabt
          ./scripts/check-wasm-imports.sh \
            target/wasm32-unknown-unknown/release/bitcoin_address_contract.wasm \
            target/wasm32-unknown-unknown/release/bitcoin_tip_contract.wasm

      # A contract's key is BLAKE3(BLAKE3(wasm) || params), so the code hash IS
      # the contract's identity. Print it so a re-key is visible in the log of
      # the run that caused it -- including one caused only by reformatting,
      # since release binaries embed panic locations as file:line.
      #
      # These must MATCH what a developer's machine produces. They did not,
      # until scripts/build-contracts.sh started remapping the build machine's
      # paths out of the binary: dependency panic locations are absolute, so
      # /home/runner/.cargo/... and /home/ian/.cargo/... were two different
      # contracts built from one source. The pinned ids in webapp/src/keys.rs
      # are what caught it, on the first run after CI was fixed so they
      # actually executed.
      - name: Report contract code hashes
        run: |
          for f in target/wasm32-unknown-unknown/release/bitcoin_*_contract.wasm; do
            echo "$(b3sum --no-names "$f" 2>/dev/null || sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
          done

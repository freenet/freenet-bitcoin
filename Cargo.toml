[workspace]
members = [
    "common",
    "generation",
    "contracts/bitcoin-address-contract",
    "contracts/bitcoin-tip-contract",
    "bridge",
    "webapp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/freenet-bitcoin"

[workspace.dependencies]
freenet-bitcoin-common = { path = "common" }
freenet-bitcoin-generation = { path = "generation" }

# 0.8.5 is what freenet-core and River are on. The bump is not cosmetic: it is
# required for freenet-migrate's runtime half, because freenet-stdlib's
# __frnt_set_id is unconditionally #[no_mangle] and two versions cannot link.
freenet-stdlib = "0.8.5"
freenet-scaffold = "0.2.2"

# The migration machinery, and with it the frozen pointer contract that lets a
# reader discover which contract generation a bridge is publishing to. Pinned
# at the workspace level so the bridge and the webapp resolve pointers with one
# implementation rather than two.
freenet-migrate = { version = "0.6", default-features = false }
freenet-scaffold-macro = "0.2.2"

serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc", "serde"] }
blake3 = { version = "1", default-features = false }
bs58 = "0.5"
hex = "0.4"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

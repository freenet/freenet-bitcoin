# Several generations are recorded here rather than one, because it is not
# determinable from the repository which of them signet is running.
#
# `webapp/contracts/*.wasm` is gitignored build output, and the copy in the
# working tree hashed to A4 while the committed source built to A5 -- and
# NEITHER is what that source builds from a clean `target/`, which is A6. A
# stale target directory changes the contract's identity: `cargo clean -p` of
# the workspace crates still reuses dependency artifacts, and under fat LTO
# those yield a different module. So whatever was published came from one of
# these builds and the repository cannot say which.
#
# Listing a generation that was never published costs one wasted probe;
# omitting one that was orphans its state. Hence all three.
#
# PROCEDURE ADDENDUM: build from a clean `target/` before reading a hash. Two
# fresh clones at different paths agree; a long-lived working tree may not
# agree with either.

[[entry]]
version = "A4"
description = "Embedded in the working tree's webapp bundle and matching the contract-id vector formerly pinned in webapp/src/keys.rs, so plausibly the generation published on signet. Built from a stale target directory; not reproducible from source"
date = "2026-09-04"

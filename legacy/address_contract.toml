# Superseded generations of bitcoin-address-contract.
#
# A contract's key is BLAKE3(BLAKE3(wasm) || params), so every entry here names
# a DIFFERENT live contract instance per watched script. The migration probe
# walks these newest-first, folds what it finds into the current generation,
# and PUTs the result forward.
#
# Folding is exact rather than best-effort here: the state is a CRDT whose
# merge is associative, commutative and idempotent (asserted on exact bytes in
# freenet-bitcoin-common, and by `fdev verify-merge`). So FoldAll across
# generations is the same operation the network performs between peers, and
# recovering an old generation cannot lose a newer observation.
#
# List ONLY superseded hashes. The current generation is derived from the WASM
# this build ships, never written down.
#
# PROCEDURE: append the outgoing hash BEFORE rebuilding the contract, then
# commit the entry and the rebuilt WASM together. `cargo make code-hashes`
# prints the current hash to compare against.
#
# EVERY ENTRY UP TO AND INCLUDING A7 IS A NOVA-SPECIFIC BUILD and cannot be
# reproduced from this source anywhere else. Until A8 the contracts had the
# build machine's own cargo-registry paths compiled into them, via dependency
# panic locations, so the same commit built on another machine was a different
# contract. These hashes are still exactly right as a record of what was LIVE
# -- everything was deployed from nova -- and that is all this file is for. But
# do not treat them as checkable against source: they are not, and A8 onward
# are (see scripts/build-contracts.sh).

[[entry]]
version = "A1"
description = "First deployment on signet"
date = "2026-09-02"

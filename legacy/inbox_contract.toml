# Superseded generations of bitcoin-inbox-contract. See address_contract.toml
# for the procedure: append the outgoing hash BEFORE rebuilding, and commit the
# entry with the rebuilt WASM.
#
# Unlike the address and tip contracts, nothing is migrated forward from an old
# inbox generation. Its entries are requests dated within about half an hour of
# the Bitcoin mainnet tip, and a sender knows its request was read when the
# inbox holds a removal naming it. A request left unread in a superseded inbox is
# therefore not carried over: its sender resends to the generation the inbox
# pointer names. Entries are recorded so scripts/deploy.sh can refuse to move
# the bridge back onto a retired generation.
#
[[entry]]
version = "I1"
description = "The first deployed inbox (#4, #10). Superseded by the one that admits entries a delegated watch key signed; its entries without a delegation are the same bytes in its successor."
date = "2026-09-26"
code_hash = "387f25c22f59019bd12e844c5c78d702fbd91c930edc1c5d68aa8c15f30e4414"

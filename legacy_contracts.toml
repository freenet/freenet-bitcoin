# Contract code hashes this project has published.
#
# A contract's key is BLAKE3(BLAKE3(wasm) || params), so ANY change to the WASM
# moves every instance to a new key. This file records superseded hashes so a
# re-key is deliberate and recorded, and so a client can probe a predecessor
# instead of silently reading an empty contract.
#
# ## The trap that produced the first entry here
#
# "Any change to the WASM" is broader than it sounds. Release binaries embed
# panic locations as file:line, so **running cargo fmt re-keys every contract**
# even though not one line of logic changed. That is how the first pair below
# became historical: the contracts were deployed, then the source was
# reformatted, and the next build produced different bytes at an identical
# 497,119 bytes. Same size, different hash, different key.
#
# The lesson is not "avoid fmt" -- it is that the code hash must be re-derived
# and recorded from the artifact you actually deploy, never assumed to be
# unchanged because the logic did not change.
#
# ## Why a re-key costs less here than in River or Delta
#
# There the contract holds irreplaceable user data. Here it holds bridge-signed
# observations of the Bitcoin blockchain, which are fully RECONSTRUCTIBLE: after
# a re-key the bridge republishes and within about one block the new contract
# says everything the old one did. Nothing becomes unrecoverable.
#
# So the risk is a stale READ, not data loss -- a client holding a cached id
# reads an empty contract and cannot tell that apart from "this address has no
# activity". Two things already mitigate that, and they matter more than this
# file:
#
#   1. The durable reference is the Bitcoin script itself, (network,
#      script_pubkey). It is independent of the WASM and never changes. That is
#      the stable identity anchor; the contract key is derived from it.
#   2. The bridge publishes the current address_code_hash and tip_contract_id
#      over the unauthenticated GET /v1/status, and clients resolve at runtime
#      rather than compiling an id in, so a re-key is picked up on the next
#      status fetch.
#
# ## Procedure when the WASM changes
#
# Append the OUTGOING hash below before rebuilding, then commit the new hash
# and the change together.

[[entry]]
contract = "bitcoin-address-contract"
code_hash = "17119f570ec1ab254116e481dea4b6827c0aee021696e7f685ad15863f55a02a"
rustc = "1.96.0"
superseded = true
note = "first deployment, 2026-09-02; superseded by a cargo fmt reformat"

